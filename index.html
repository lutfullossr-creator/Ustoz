<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingliz tili lug’at daftari</title>
<style>
:root{--bg:linear-gradient(160deg,#e8effa 0%,#f6f3ee 55%,#e6eef9 100%);--paper:#ffffff;--ink:#111114;--muted:#4a4a55;--line:#e1e5ee;--margin:transparent;--accent:#0b3fa8;--tj:#8a3a12;--btn:#eef3fc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:linear-gradient(160deg,#0b0f16 0%,#151c29 60%,#0b0f16 100%);--paper:#181e2a;--ink:#ffffff;--muted:#c3c1cf;--line:#2a3345;--margin:transparent;--accent:#9bbcff;--tj:#ffb48a;--btn:#222b3b}}
:root[data-theme="dark"]{--bg:linear-gradient(160deg,#0b0f16 0%,#151c29 60%,#0b0f16 100%);--paper:#181e2a;--ink:#ffffff;--muted:#c3c1cf;--line:#2a3345;--margin:transparent;--accent:#9bbcff;--tj:#ffb48a;--btn:#222b3b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;font-size:1.125rem}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 28px}
h1{font-size:1.6rem;margin:6px 4px 14px;font-weight:800}
.sheet{background:var(--paper);border-radius:20px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(30,50,90,.12),0 1px 3px rgba(30,50,90,.08);padding:6px 16px 10px}
.head,.row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:12px;align-items:start}
.cell{min-width:0}
.l1,.l2{display:flex;flex-wrap:wrap;column-gap:10px;align-items:baseline}
.head{color:var(--muted);font-size:.9rem;font-weight:700;min-height:40px;border-bottom:2px solid var(--ink)}
.spk{width:44px;height:44px;min-width:44px;padding:0;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--btn)}
.spk:not(:disabled):hover{background:var(--accent);color:var(--paper)}
.spk.on{background:var(--accent);color:var(--paper);animation:ring 1s ease-out infinite}
.spk.on svg{animation:bump .5s ease-in-out infinite alternate}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes bump{to{transform:scale(1.2)}}
.swap .row{animation:rw .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes rw{from{opacity:0;transform:translateX(var(--dx,14px))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.row{position:relative;min-height:84px;padding:10px 0;border-bottom:1px solid var(--line)}
.en{font-size:1.35rem;font-weight:800;color:var(--accent)}
.rd{font-size:1rem;font-weight:600;color:var(--muted)}
.uz{font-size:1.15rem;font-weight:700}
.tj{font-size:1.05rem;font-weight:700;color:var(--tj)}
.pager{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;margin:14px -12px 0;padding:10px 12px;background:var(--paper);border-top:1px solid var(--line)}
.pager select{flex:1;min-width:0;text-align:center;text-align-last:center;font-weight:800;font-size:1.05rem;border:2px solid var(--line);border-radius:8px}
button{font:inherit;background:var(--btn);color:var(--ink);border:2px solid var(--line);border-radius:8px;min-width:48px;height:48px;padding:0 12px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,background-color .2s,color .2s,border-color .2s,box-shadow .2s}
button:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(30,50,90,.16);border-color:var(--accent)}
button:not(:disabled):active{transform:scale(.93);box-shadow:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-current="page"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.info{text-align:center;color:var(--muted);font-size:1rem;font-weight:600;margin:2px 0 16px}
details{border:2px solid var(--line);border-radius:8px;padding:12px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gear{width:48px;padding:0;display:grid;place-items:center}
.gear[aria-expanded="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.gear svg{transition:transform .35s ease}
.gear[aria-expanded="true"] svg{transform:rotate(90deg)}
.panel{overflow:hidden;visibility:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .25s ease,margin .3s ease,visibility .3s}
.panel.open{visibility:visible;max-height:240px;opacity:1;margin:0 0 14px}
.panel b{display:block;margin:2px 2px 10px;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px}
.chip{height:42px;border-radius:999px;font-size:.98rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.search{width:100%;height:54px;margin:0 0 14px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:1.1rem;font-weight:700}
.search:focus{border-color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.tabs2,.tabs3,.cbar{display:flex;gap:8px;margin:0 0 14px}
.tab{flex:1;min-width:0;padding:0 2px;border-radius:12px;font-size:.92rem}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.wrap.rl>.panel,.wrap.rl>.search,.wrap.rl>#sheet,.wrap.rl>#pager,.wrap.rl>.info,.wrap.rl>details{display:none}
.wrap.rl .gear{visibility:hidden}
.wrap:not(.rl)>#rules{display:none}
#rules details,#phrases details{margin:0 0 12px;border-radius:14px;background:var(--paper);box-shadow:0 6px 18px rgba(30,50,90,.08)}
#rules summary,#phrases summary{font-size:1.2rem;font-weight:800;color:var(--accent);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:40px;cursor:pointer}
#rules summary::-webkit-details-marker,#phrases summary::-webkit-details-marker{display:none}
#rules summary::after,#phrases summary::after{content:"+";font-size:1.6rem;transition:transform .25s ease}
#rules details[open] summary::after,#phrases details[open] summary::after{transform:rotate(45deg)}
.rl-line{margin:8px 0;font-size:1.1rem;font-weight:600}
.rl-line b{color:var(--accent)}
.ex{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex .en{font-size:1.2rem}
.ex .uz{font-size:1.05rem}
.wrap.pl>.panel,.wrap.pl>.search,.wrap.pl>#sheet,.wrap.pl>#pager,.wrap.pl>.info,.wrap.pl>details{display:none}
.wrap.pl .gear{visibility:hidden}
.wrap:not(.pl)>#phrases{display:none}
.exb{display:block;width:100%;height:auto;min-height:0;margin-top:8px;padding:8px 12px;text-align:left;font-weight:600;font-size:1rem;border:0;border-left:4px solid var(--accent);border-radius:8px;background:var(--btn)}
.exb span{display:block}
.exe{font-weight:800}
.exr{font-size:.92rem;color:var(--muted);font-style:italic}
.exu{font-size:.98rem}
.exb.on{background:var(--accent)}
.exb.on span{color:var(--paper)}
.chk{width:44px;height:44px;min-width:44px;padding:0;border-radius:50%;font-size:1.2rem;color:var(--muted)}
.chk[aria-pressed="true"]{background:#1f8f55;border-color:#1f8f55;color:#fff}
.wrap.ml>.panel,.wrap.ml>.search,.wrap.ml>#sheet,.wrap.ml>#pager,.wrap.ml>.info,.wrap.ml>details{display:none}
.wrap.ml .gear{visibility:hidden}
.wrap:not(.ml)>#practice{display:none}
.score{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;font-weight:800;color:var(--muted);margin:0 2px 14px}
.qsent{font-size:1.7rem;font-weight:800;line-height:1.4;margin:6px 2px}
.blank{color:var(--accent);border-bottom:3px solid var(--accent);padding:0 4px;letter-spacing:2px}
.qhint{font-size:1.1rem;font-weight:700;color:var(--muted);margin:6px 2px 18px}
.qbtns{display:flex;gap:10px;margin:0 0 14px}
.qbtns button{flex:1;font-size:1.05rem}
.prim{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.fb{font-size:1.2rem;font-weight:800;min-height:3em}
.fb.ok{color:#17794a}
.fb.bad{color:#c0392b}
@media (prefers-color-scheme:dark){.fb.ok{color:#5fd49a}.fb.bad{color:#ff8a8a}}
.shake{animation:shake .35s}
.pop{animation:pop .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.04)}}
#practice.bm>:not(#build):not(.tabs2):not(#sc){display:none}
#practice:not(.bm)>#build{display:none}
.slot{min-height:68px;padding:10px 12px;border:2px dashed var(--line);border-radius:12px;font-size:1.3rem;font-weight:800;margin:0 0 14px;overflow-wrap:break-word}
.wchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.wchips button{height:48px;font-size:1.1rem}
.wchips button:disabled{opacity:.3}
.wrap.xl>.panel,.wrap.xl>.search,.wrap.xl>#sheet,.wrap.xl>#pager,.wrap.xl>.info,.wrap.xl>details{display:none}
.wrap.xl .gear{visibility:hidden}
.wrap:not(.xl)>#trans{display:none}
.tarea{height:auto;min-height:104px;padding:12px 18px;resize:vertical;font-family:inherit;line-height:1.4}
.note{color:var(--muted);font-weight:600;font-size:.95rem;margin:0 2px 14px}
.tc{padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--paper)}
.tl{font-size:.85rem;font-weight:800;color:var(--muted);margin:0 0 4px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tt{font-size:1.35rem;font-weight:800;overflow-wrap:break-word;min-width:0}
.sg{display:block;width:100%;height:auto;text-align:left;margin:0 0 8px;padding:10px 12px;font-size:1rem;font-weight:700}
.sg small{display:block;color:var(--muted);font-weight:600}
.wrap.ch>.panel,.wrap.ch>.search,.wrap.ch>#sheet,.wrap.ch>#pager,.wrap.ch>.info,.wrap.ch>details{display:none}
.wrap.ch .gear{visibility:hidden}
.wrap:not(.ch)>#chat{display:none}
.msgs{max-height:46vh;min-height:180px;overflow:auto;padding:4px 2px;margin:0 0 12px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;margin:0 0 10px;font-size:1.1rem;font-weight:600;overflow-wrap:break-word}
.bot{background:var(--paper);border:2px solid var(--line);border-bottom-left-radius:4px}
.me{margin-left:auto;background:var(--accent);color:var(--paper);border-bottom-right-radius:4px}
.bt{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bt b{font-weight:800}
.bu{color:var(--muted);font-size:.95rem;margin-top:4px}
.bnote{max-width:88%;margin:-4px 0 10px auto;color:var(--tj);font-weight:700;font-size:.95rem}
.cin{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.cin .search{flex:1;min-width:0;margin:0;height:50px}
.scn{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 10px;padding:0 2px 4px;scrollbar-width:none}
.scn button{flex:0 0 auto;min-width:104px;height:42px;font-size:.88rem}
.cbar button{height:40px;font-size:.85rem}
.tabs3 .tab{font-size:.85rem}
#tonl{flex:1.7}
.tbtn{display:flex;gap:8px}
.tbtn .aa{order:2}
.wrap .aa{visibility:visible!important;font-size:1rem}
.vp{overflow:hidden;visibility:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .25s ease,margin .3s ease,visibility .3s}
.vp.open{visibility:visible;max-height:240px;opacity:1;margin:0 0 14px}
.vp b{display:block;margin:2px 2px 8px}
.vp .chips{margin-bottom:8px}
#practice.km>:not(#cards):not(.tabs2):not(#sc){display:none}
#practice:not(.km)>#cards{display:none}
.fc{min-height:240px;padding:18px;border:2px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 8px 24px rgba(30,50,90,.1);margin:0 0 14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:8px}
.fcf,.fcb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fcb{display:none}
.fc.flip .fcf{display:none}
.fc.flip .fcb{display:flex;animation:pop .3s}
.fce{font-size:2rem;font-weight:800;color:var(--accent);overflow-wrap:break-word;max-width:100%}
.cbar{flex-wrap:wrap}
#chat.hu .bu,#chat.hu .sg small{display:none}
#cd.on{background:var(--accent);color:var(--paper)}
select{font:inherit;width:100%;height:48px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--ink);padding:0 10px}
summary{cursor:pointer;font-weight:700}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
input{font:inherit;width:100%;height:48px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--ink)}
form button{grid-column:1/-1;background:var(--accent);color:var(--paper);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="app">
<header class="top"><h1>Lug’at daftari</h1><div class="tbtn"><button id="aa" class="gear aa" aria-label="Ko’rinish: mavzu va shrift hajmi" aria-expanded="false">Aa</button><button id="gear" class="gear" aria-label="Sozlamalar" aria-expanded="false" aria-controls="panel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div></header>
<div class="vp" id="vp"></div>
<div class="tabs"><button class="tab" data-t="v" aria-pressed="true">Lug’at</button><button class="tab" data-t="p" aria-pressed="false">Jumlalar</button><button class="tab" data-t="r" aria-pressed="false">Qoidalar</button><button class="tab" data-t="m" aria-pressed="false">Mashq</button><button class="tab" data-t="t" aria-pressed="false">Tarjima</button><button class="tab" data-t="c" aria-pressed="false">Suhbat</button></div>
<div class="panel" id="panel"><b>Turkum va holat</b><div class="chips" id="chips"></div></div>
<input id="q" class="search" type="search" placeholder="So’z qidirish..." aria-label="Qidirish">
<div class="sheet" id="sheet" aria-live="polite"></div>
<div class="info" id="info"></div>
<details>
<summary>Yangi so’z qo’shish</summary>
<form id="f">
<input name="en" placeholder="English" required>
<input name="rd" placeholder="O’qilishi">
<input name="uz" placeholder="O’zbekcha" required>
<input name="tj" placeholder="Тоҷикӣ">
<select name="pos" style="grid-column:1/-1" aria-label="So’z turkumi"><option value="n">Ot</option><option value="v">Fe’l</option><option value="a">Sifat</option><option value="d">Ravish</option><option value="o">Boshqa</option></select>
<button type="submit">Qo’shish</button>
</form>
</details>
<section id="rules"></section>
<section id="phrases"></section>
<section id="practice"><div class="tabs2"><button class="tab" data-m="w" aria-pressed="true">Yozish</button><button class="tab" data-m="b" aria-pressed="false">Tuzish</button><button class="tab" data-m="s" aria-pressed="false">Varaq</button><button class="tab" data-m="k" aria-pressed="false">Karta</button></div><div class="score" id="sc"></div><div class="qsent" id="qs"></div><div class="qhint" id="qh"></div><input id="qa" class="search" placeholder="To’g’ri so’zni yozing" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Javob"><div class="qbtns"><button id="qc" class="prim">Tekshirish</button><button id="qk">Maslahat</button></div><div id="qf" class="fb" aria-live="polite"></div><div id="build"><div class="qhint" id="bh"></div><div class="slot" id="bs"></div><div class="wchips" id="bw"></div><div class="qbtns"><button id="bc">Tozalash</button><button id="bn" class="prim">Keyingi</button></div><div id="bf" class="fb" aria-live="polite"></div></div><div id="cards"><div class="fc" id="fc" tabindex="0" role="button" aria-label="Kartani aylantirish"><div class="fcf" id="fcf"></div><div class="fcb" id="fcb"></div></div><div class="qbtns"><button id="fno">Bilmayman</button><button id="fyes" class="prim">Bilaman</button></div><div class="note" id="fst"></div></div></section>
<section id="trans"><div class="tabs3" id="tl"><button class="tab" data-l="a" aria-pressed="true">Avto</button><button class="tab" data-l="en" aria-pressed="false">EN</button><button class="tab" data-l="ru" aria-pressed="false">RU</button><button class="tab" data-l="uz" aria-pressed="false">UZ</button><button class="tab" data-l="tj" aria-pressed="false">TJ</button><button class="tab" id="tonl" aria-pressed="true">Onlayn</button></div><textarea id="ti" class="search tarea" placeholder="So’z yoki jumla yozing (EN, RU, UZ, TJ)..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tarjima uchun matn"></textarea><div class="note" id="tn"></div><div id="to"></div><div id="tsg"></div></section>
<section id="chat"><div class="scn" id="csc"></div><div class="cbar"><button class="tab" id="cai" aria-pressed="false" hidden>AI bilan</button><button class="tab" id="cvo" aria-pressed="false">Ovozli</button><button class="tab" id="ctr" aria-pressed="true">Tarjima</button><button class="tab" id="crs">Qaytadan</button></div><div class="msgs" id="cm" aria-live="polite"></div><div id="cc"></div><div class="cin"><input id="cx" class="search" placeholder="Inglizcha yozing..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Xabar"><button id="cd" aria-label="Ovoz bilan yozish" hidden>Mikrofon</button><button id="cs" class="prim">Yuborish</button></div><p class="note">Oflayn bot tayyor savollar asosida ishlaydi. Onlayn sahifada “AI bilan” tugmasi chiqadi: u haqiqiy sun’iy intellekt bilan suhbat.</p></section>
<div class="pager" id="pager"></div>
</div>
<script src="cordova.js"></script>

];

var RULES=[
["1. Artikllar: a / an / the",["<b>a</b> + undosh tovush: a book, a car","<b>an</b> + unli tovush: an apple, an egg","Harfga emas, <b>tovushga</b> qaraladi: an hour, a university","<b>the</b> + aniq narsa: the door","Artikl kerak emas: umumiy ko’plik va ichimliklar: I like tea."],[["I have an apple.","Menda olma bor."],["She is a teacher.","U o’qituvchi."],["Open the door, please.","Eshikni oching, iltimos."]]],
["2. Ko’plik shakli (jam)",["Ko’pchilik: <b>+s</b>: book → books","s, x, ch, sh bilan tugasa: <b>+es</b>: bus → buses, box → boxes, watch → watches","Undosh + y: <b>y → ies</b>: city → cities (day → days)","f / fe → <b>ves</b>: knife → knives","Tartibsiz: man → men, woman → women, child → children, person → people, foot → feet"],[["Two books.","Ikkita kitob."],["Three buses.","Uchta avtobus."],["Four children.","To’rtta bola."]]],
["3. To be: am / is / are",["I <b>am</b>, he / she / it <b>is</b>, you / we / they <b>are</b>","Inkor: <b>not</b> qo’shiladi: She is not here.","Savol: <b>Are</b> you ready?"],[["I am a programmer.","Men dasturchiman."],["She is at home.","U uyda."],["Are you ready?","Tayyormisiz?"]]],
["4. Have / has (bor)",["I / you / we / they <b>have</b>","he / she / it <b>has</b>","Inkor: <b>don’t have</b> / <b>doesn’t have</b>"],[["I have a friend.","Mening do’stim bor."],["She has a car.","Uning mashinasi bor."],["I don’t have time.","Mening vaqtim yo’q."]]],
["5. This / that / these / those",["<b>this</b> (bu): yaqin, bitta. <b>these</b> (bular): yaqin, ko’p","<b>that</b> (anavi): uzoq, bitta. <b>those</b> (anavilar): uzoq, ko’p"],[["This is my phone.","Bu mening telefonim."],["Those are books.","Anavilar kitoblar."]]],
["6. Predloglar: in / on / at",["<b>in</b>: ichida: in the room, in Tashkent","<b>on</b>: ustida: on the table","<b>at</b>: nuqta yoki vaqt: at home, at 5 o’clock"],[["The book is on the table.","Kitob stol ustida."],["I am at home.","Men uydaman."],["We live in Tashkent.","Biz Toshkentda yashaymiz."]]],
["7. Present Simple (odat)",["I / you / we / they + fe’l. He / she / it + fe’l<b>+s</b>","Inkor: <b>don’t / doesn’t</b> + fe’l","Savol: <b>Do / Does</b> + ega + fe’l?"],[["She works every day.","U har kuni ishlaydi."],["I don’t like tea.","Men choyni yoqtirmayman."],["Do you speak English?","Inglizcha gapirasizmi?"]]],
["8. Present Continuous (hozir)",["<b>am / is / are</b> + fe’l<b>+ing</b>","Savol: <b>Are</b> you working?"],[["I am reading now.","Men hozir o’qiyapman."],["They are playing football.","Ular futbol o’ynayapti."]]],
["9. Past Simple (o’tgan)",["Fe’l<b>+ed</b>: work → worked","Tartibsiz: go → went, see → saw, eat → ate, have → had","Inkor va savol: <b>didn’t / Did</b> + fe’lning asl shakli"],[["I worked yesterday.","Men kecha ishladim."],["She went home.","U uyga ketdi."],["Did you eat?","Ovqat yedingizmi?"]]],
["10. Future Simple va can",["<b>will</b> + fe’l (kelasi): I will call you.","Inkor: <b>won’t</b>. Savol: <b>Will</b> you come?","<b>can</b> + fe’l (qila olaman). Inkor: <b>can’t</b>"],[["I will call you tomorrow.","Ertaga sizga qo’ng’iroq qilaman."],["I can speak English.","Men inglizcha gapira olaman."],["I can’t swim.","Men suzolmayman."]]],
["11. Egalik: my / your / his / her",["<b>my</b> (mening), <b>your</b> (sening, sizning), <b>his</b> (uning, erkak), <b>her</b> (uning, ayol)","<b>its</b> (uning, narsa), <b>our</b> (bizning), <b>their</b> (ularning)","Ism + <b>’s</b>: Ali’s book (Alining kitobi)"],[["This is my phone.","Bu mening telefonim."],["Her name is Anna.","Uning ismi Anna."],["It is Ali’s book.","Bu Alining kitobi."]]],
["12. Olmoshlar: ega va to’ldiruvchi",["Ega: I, you, he, she, it, we, they","To’ldiruvchi: <b>me, you, him, her, it, us, them</b>","Fe’ldan keyin to’ldiruvchi shakli keladi: I see <b>him</b>."],[["She likes him.","U uni yoqtiradi."],["Give it to me.","Buni menga bering."],["We help them.","Biz ularga yordam beramiz."]]],
["13. There is / There are (bor)",["<b>There is</b> + bitta narsa: There is a book.","<b>There are</b> + ko’p narsa: There are two books.","Inkor: <b>isn’t / aren’t</b>. Savol: <b>Is there</b> ...? / <b>Are there</b> ...?"],[["There is a cat in the room.","Xonada mushuk bor."],["There are three apples.","Uchta olma bor."],["Is there any water?","Suv bormi?"]]],
["14. Savol so’zlari",["<b>What</b> (nima), <b>Where</b> (qayerda), <b>When</b> (qachon)","<b>Who</b> (kim), <b>Why</b> (nega), <b>How</b> (qanday)","Tartib: savol so’zi + do/does/is/are + ega + fe’l"],[["What is your name?","Ismingiz nima?"],["Where do you live?","Qayerda yashaysiz?"],["Why are you late?","Nega kechikdingiz?"],["How old are you?","Yoshingiz nechada?"]]],
["15. Some / any / much / many",["<b>some</b>: darak gapda: I have some water.","<b>any</b>: savol va inkorda: Do you have any money?","<b>many</b> + sanaladigan (ko’plik): many books","<b>much</b> + sanalmaydigan: much water. <b>a lot of</b> ikkalasiga ham mos"],[["I have some friends.","Mening bir nechta do’stim bor."],["How many books?","Nechta kitob?"],["How much water?","Qancha suv?"],["I don’t have any time.","Mening vaqtim yo’q."]]],
["16. Sifat darajalari",["Qisqa sifat: <b>+er</b>, <b>the +est</b>: big → bigger → the biggest","Uzun sifat: <b>more</b>, <b>the most</b>: beautiful → more beautiful","Tartibsiz: good → <b>better</b> → <b>the best</b>, bad → <b>worse</b> → <b>the worst</b>","Solishtirish: <b>than</b> (-dan): bigger than"],[["This car is bigger than that car.","Bu mashina anavi mashinadan katta."],["She is the best student.","U eng yaxshi talaba."],["Tea is cheaper than coffee.","Choy qahvadan arzon."]]],
["17. Ravish va chastota so’zlari",["Sifat + <b>ly</b> = ravish: slow → slowly, quick → quickly","Tartibsiz: good → <b>well</b>. fast va late o’zgarmaydi","Chastota: <b>always, usually, often, sometimes, never</b>","Chastota so’zi fe’ldan <b>oldin</b>, to be dan <b>keyin</b>: I always drink tea. She is never late."],[["I always drink tea.","Men doim choy ichaman."],["He speaks slowly.","U sekin gapiradi."],["She is never late.","U hech qachon kechikmaydi."]]],
["18. Buyruq gap va Let’s",["Fe’lning asl shakli: <b>Open</b> the door.","Inkor: <b>Don’t</b> + fe’l: Don’t run.","Muloyim: <b>Please</b> qo’shiladi.","Taklif: <b>Let’s</b> + fe’l: Let’s go."],[["Sit down, please.","Iltimos, o’tiring."],["Don’t speak here.","Bu yerda gapirmang."],["Let’s eat now.","Keling, hozir ovqatlanamiz."]]],
["19. Want / like / need + to",["<b>want to</b> + fe’l (xohlamoq): I want to learn.","<b>need to</b> + fe’l (kerak): I need to go.","<b>like</b> + fe’l<b>+ing</b>: I like reading.","<b>would like to</b> (xohlardim, muloyim): I would like to order."],[["I want to learn English.","Men ingliz tilini o’rganmoqchiman."],["She needs to work.","Unga ishlash kerak."],["I like reading books.","Men kitob o’qishni yaxshi ko’raman."]]],
["20. Vaqt predloglari: at / on / in",["<b>at</b>: soat va payt: at 5 o’clock, at night","<b>on</b>: kun va sana: on Monday, on 5 May","<b>in</b>: oy, yil, fasl, kun qismi: in July, in 2026, in the morning","<b>from ... to</b>: dan ... gacha"],[["I wake up at 7 o’clock.","Men soat 7 da uyg’onaman."],["We work on Monday.","Biz dushanba kuni ishlaymiz."],["It is cold in winter.","Qishda sovuq bo’ladi."]]],
["21. To be (o’tgan): was / were",["I / he / she / it <b>was</b>","you / we / they <b>were</b>","Inkor: <b>wasn’t / weren’t</b>. Savol: <b>Was</b> he ...? / <b>Were</b> you ...?"],[["I was at home yesterday.","Men kecha uyda edim."],["They were tired.","Ular charchagan edi."],["Were you ready?","Tayyor edingizmi?"]]],
["22. Past Continuous (o’tgan davom)",["<b>was / were</b> + fe’l<b>+ing</b>","O’tgan paytda davom etgan ish: I was sleeping at 10."],[["I was sleeping.","Men uxlayotgan edim."],["They were playing football.","Ular futbol o’ynayotgan edi."]]],
["23. Present Perfect (natija)",["<b>have / has</b> + fe’lning 3-shakli (V3)","V3: work → worked, go → gone, see → seen, eat → eaten","Belgilar: <b>already</b> (allaqachon), <b>yet</b> (hali), <b>ever</b> (hech)","Inkor: <b>haven’t / hasn’t</b> + V3"],[["I have finished work.","Men ishni tugatdim."],["She has gone home.","U uyga ketib bo’ldi."],["Have you eaten yet?","Ovqat yedingizmi?"]]],
["24. Modal fe’llar: must / should",["<b>must</b> + fe’l: shart: You must stop here.","<b>should</b> + fe’l: maslahat: You should sleep.","<b>have to</b> + fe’l: kerak: I have to work.","Modal fe’ldan keyin <b>-s</b> yo’q va <b>to</b> yo’q (have to dan tashqari)"],[["You must stop here.","Siz bu yerda to’xtashingiz shart."],["You should drink water.","Siz suv ichishingiz kerak."],["I have to go now.","Men hozir ketishim kerak."]]],
["25. Going to (reja)",["<b>am / is / are going to</b> + fe’l","Reja yoki aniq niyat: I am going to study."],[["I am going to call him.","Men unga qo’ng’iroq qilmoqchiman."],["She is going to buy a car.","U mashina sotib olmoqchi."],["We are going to travel.","Biz sayohat qilmoqchimiz."]]],
["26. Joy predloglari (Prepositions of place)",["<b>in</b> ichida · <b>on</b> ustida (tegib) · <b>at</b> nuqtada","<b>under / below</b> ostida · <b>over / above</b> tepasida (tegmay)","<b>in front of</b> oldida · <b>behind</b> orqasida · <b>next to / beside</b> yonida","<b>between</b> ikki narsa orasida · <b>among</b> ko’p narsa orasida","<b>near / close to</b> yaqinida · <b>far from</b> uzoqda","Harakat: <b>into</b> ichiga · <b>out of</b> ichidan · <b>through</b> orqali · <b>across</b> narigi tomonga · <b>along</b> bo’ylab · <b>up / down</b> yuqoriga / pastga · <b>onto</b> ustiga · <b>off</b> ustidan"],[["There is some pizza in the box.","Qutida pitsa bor."],["There is a guitar between the lamp and the plant.","Chiroq bilan o’simlik orasida gitara bor."],["There are two dogs under the table.","Stol ostida ikkita it bor."],["There is a window behind the sofa.","Divan orqasida deraza bor."],["There is a racket next to the bag.","Sumka yonida raketka bor."],["There is a bird flying over the trees.","Daraxtlar ustida uchayotgan qush bor."]]],
["27. O’qilish: [ɔ:] tovushi",["Harf birikmalari: <b>a+l, au, aw, augh, ough, o+r, wa+r</b>","Hammasi uzun [ɔ:] tovushini beradi"],[["fall","[fɔ:l] tushmoq"],["autumn","[ˈɔ:təm] kuz"],["draw","[drɔ:] chizmoq"],["daughter","[ˈdɔ:tə] qiz (farzand)"],["thought","[θɔ:t] fikr"],["horse","[hɔ:s] ot"],["warm","[wɔ:m] iliq"]]],
["28. O’qilish: [aɪ] tovushi (ay)",["Harf birikmalari: <b>i, ie, y, uy, igh, i+gn, i+ld, i+nd</b>","Hammasi “ay” kabi o’qiladi"],[["write","[rait] yozmoq"],["die","[dai] o’lmoq"],["sky","[skai] osmon"],["buy","[bai] sotib olmoq"],["right","[rait] to’g’ri, o’ng"],["sign","[sain] belgi"],["child","[tʃaild] bola"],["mind","[maind] aql"]]],
["29. O’qilish: [ɔɪ] va [ou] tovushlari",["[ɔɪ] (oy): <b>oi, oy</b>","[ou] (ou): <b>o, oa, ow, o+ld, o+ll</b>"],[["boil","[bɔil] qaynatmoq"],["toy","[tɔi] o’yinchoq"],["photo","[ˈfoutou] surat"],["road","[roud] yo’l"],["slow","[slou] sekin"],["cold","[kould] sovuq"],["roll","[roul] dumalamoq"]]],
["30. Egalik kelishigi: ’s va s’",["Bitta odam yoki hayvon: <b>’s</b>: Mary’s schoolbag, the cat’s tail","Bir nechta (-s bilan tugagan ko’plik): <b>s’</b>: the boys’ dogs","Tartibsiz ko’plik (men, women, children, people): <b>’s</b>: the men’s hats","Ism va oila a’zolari: Tom’s pen, Dad’s hat, Mum’s dress","Tartib: egasi + <b>’s</b> + narsa"],[["This is Mary’s schoolbag.","Bu Merining sumkasi."],["It is the cat’s tail.","Bu mushukning dumi."],["These are the boys’ dogs.","Bular o’g’il bolalarning itlari."],["These are the men’s hats.","Bular erkaklarning shlyapalari."],["That is Dad’s hat.","Bu dadamning shlyapasi."],["That is Mum’s dress.","Bu onamning ko’ylagi."]]],
["31. Egalik olmoshlari: my / mine",["<b>I</b> → my → mine","<b>you</b> → your → yours","<b>he</b> → his → his","<b>she</b> → her → hers","<b>it</b> → its → —","<b>we</b> → our → ours","<b>they</b> → their → theirs","<b>my</b> + ot: my hat. <b>mine</b> otsiz: The hat is mine."],[["That isn’t your hat.","Bu sening shlyapang emas."],["It is his hat.","Bu uning shlyapasi."],["It is her dress.","Bu uning ko’ylagi."],["Susan, give me my dress, please!","Syuzan, menga ko’ylagimni bering!"],["John, give me my hat, please!","Jon, menga shlyapamni bering!"],["The hat is mine.","Shlyapa meniki."]]],
["32. Ko’plik misollari",["<b>+s</b>: book → books, pen → pens, cat → cats","<b>+es</b>: box → boxes, bus → buses","<b>y → ies</b>: baby → babies","Tartibsiz: child → children, man → men, woman → women, foot → feet"],[["One book, two books.","Bitta kitob, ikkita kitob."],["One box, two boxes.","Bitta quti, ikkita quti."],["One baby, two babies.","Bitta chaqaloq, ikkita chaqaloq."],["One child, two children.","Bitta bola, ikkita bola."],["One man, two men.","Bitta erkak, ikkita erkak."],["One woman, two women.","Bitta ayol, ikkita ayol."],["One foot, two feet.","Bitta oyoq kafti, ikkita oyoq kafti."]]]
